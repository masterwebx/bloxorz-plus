<body>
	<div id="_preload_div_">
		<img id="preload_img" src="images/preloader.gif" />
	</div>
	<div id="app-shell">
	<div id="screen-split">
		<div id="animation_container">
			<div id="theme-media" hidden>
				<img id="theme-media-img" alt="" />
				<video id="theme-media-video" autoplay loop muted playsinline></video>

			</div>
			<canvas id="canvas"></canvas>
			<div id="dom_overlay_container">
				<div id="build-version"></div>
				<input id="hud-input" type="text" maxlength="10" autocomplete="off" spellcheck="false" hidden>
				<div id="hud-theme-select" class="hud-dd" hidden>
					<button type="button" class="hud-dd-btn" id="hud-theme-btn" aria-haspopup="listbox" aria-expanded="false"></button>
					<div class="hud-dd-menu" id="hud-theme-menu" role="listbox" hidden></div>
				</div>
				<div id="hud-locale-select" class="hud-dd" hidden>
					<button type="button" class="hud-dd-btn" id="hud-locale-btn" aria-haspopup="listbox" aria-expanded="false"></button>
					<div class="hud-dd-menu" id="hud-locale-menu" role="listbox" hidden></div>
				</div>
				<button type="button" id="hud-theme-upload-btn" hidden>Upload theme</button>
				<button type="button" id="hud-theme-template-btn" hidden>Download template</button>
				<button type="button" id="hud-theme-manage-btn" hidden>Manage</button>
				<input type="color" id="hud-bg-color" hidden aria-label="Backdrop tint color" value="#b86a2e">
				<input type="color" id="hud-block-color" hidden aria-label="Block color" value="#b86a2e">
				<div id="hud-color-slots" hidden>
					<input type="color" data-slot="bg" aria-label="Backdrop color" value="#b86a2e">
					<input type="color" data-slot="block" aria-label="Block color" value="#b86a2e">
					<input type="color" data-slot="stone" aria-label="Stone color" value="#d46820">
					<input type="color" data-slot="exit" aria-label="Exit color" value="#0c0c0c">
					<input type="color" data-slot="soft" aria-label="Soft switch color" value="#4a8ee8">
					<input type="color" data-slot="heavy" aria-label="Heavy switch color" value="#9b48e0">
					<input type="color" data-slot="fragile" aria-label="Fragile color" value="#e8b44a">
					<input type="color" data-slot="split" aria-label="Split color" value="#2f9d7a">
					<input type="color" data-slot="bridgeL" aria-label="Bridge L color" value="#8a4820">
					<input type="color" data-slot="bridgeR" aria-label="Bridge R color" value="#6a3018">
				</div>
				<div id="hud-color-preset-select" class="hud-dd" hidden>
					<button type="button" class="hud-dd-btn" id="hud-color-preset-btn" aria-haspopup="listbox" aria-expanded="false"></button>
					<div class="hud-dd-menu" id="hud-color-preset-menu" role="listbox" hidden></div>
				</div>
				<div id="hud-theme-manage" hidden>
					<p id="hud-theme-manage-empty"></p>
					<div id="hud-theme-manage-list"></div>
					<button type="button" id="hud-theme-manage-back">Back</button>
				</div>
				<div id="hud-color-preset-manage" hidden>
					<p id="hud-color-preset-manage-empty"></p>
					<div id="hud-color-preset-manage-list"></div>
					<button type="button" id="hud-color-preset-manage-back">Back</button>

					<div id="play-time" hidden><span id="play-time-lab">Time</span><b id="play-time-val"></b></div>

				<p id="play-help" hidden></p>

				<p id="play-select" hidden></p>
				<div id="ach-toasts" aria-live="polite"></div>

						<div class="hud-busy-track"><div id="hud-busy-bar"></div></div>
					</div>
				</div>
				<div id="hud-modal">
					<div class="hud-modal-card">
						<p id="hud-modal-title">Enter code</p>
						<textarea id="hud-modal-input" maxlength="4096" autocomplete="off" spellcheck="false" rows="4"></textarea>
						<div class="hud-modal-row">
							<button type="button" id="hud-modal-ok">OK</button>
							<button type="button" id="hud-modal-cancel">Cancel</button>

				<div id="tab-crop-overlay" hidden>

							<tbody id="timeRows">
								<tr id='stage1'>
									<td>1</td>
									<td>-</td>
									<td>-</td>
								</tr>
								<tr id='stage2'>
									<td>2</td>
									<td>-</td>
									<td>-</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div id="touch-pad" hidden>
		<div class="tp-cluster tp-dpad" aria-label="Move">
			<button type="button" class="tp-btn tp-up" data-dir="up" aria-label="Up">▲</button>
			<button type="button" class="tp-btn tp-left" data-dir="left" aria-label="Left">◀</button>

			<button type="button" class="tp-btn tp-down" data-dir="down" aria-label="Down">▼</button>
		</div>
		<div class="tp-cluster tp-actions">
			<button type="button" class="tp-btn tp-swap" data-act="swap">OK</button>
			<button type="button" class="tp-btn tp-rotate" data-act="rotate">ROTATE</button>
			<button type="button" class="tp-btn tp-menu" data-act="pause">PAUSE</button>
		</div>
	</div>
	<div id="install-hint" hidden>
		<p>Install Bloxorz as an app. The on-screen pad overlays the stage so the playfield stays full size.</p>
		<div class="install-row">
			<button type="button" id="install-now">Install app</button>
			<button type="button" id="install-dismiss">Not now</button>
		</div>
		<p id="install-how" hidden></p>
	</div>

	<script src="version.js"></script>
	<script src="feedback.js"></script>
	<script src="levels.js"></script>
	<script src="timer.js"></script>
	<script src="code.createjs.com/createjs-2015.11.26.min.js"></script>
	<script src="bloxorz.js"></script>
	<script src="extra.bundle.js?v=1.2.36"></script>
	<script>
		var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation;
		var ATLAS_THEMES = ["original", "gray", "holiday"];

		function isAtlasTheme(value) {
			return ATLAS_THEMES.indexOf(value) !== -1;
		}

		function normalizeTheme(value) {
			if (!value) return "original";
			return value;
		}

		function getThemeFromUrl() {
			var params = new URLSearchParams(window.location.search);
			return params.get("img") || "";
		}

		function getStoredTheme() {
			var saved = window.localStorage && window.localStorage.getItem("theme");
			return normalizeTheme(saved);
		}

		function saveTheme(theme) {
			window.localStorage && window.localStorage.setItem("theme", normalizeTheme(theme));
		}

		function buildThemeUrl(theme) {
			var url = new URL(window.location.href);
			url.searchParams.set("img", normalizeTheme(theme));
			return url.toString();
		}

		function loadThemeAtlas(theme) {
			if (typeof window.__bloxLoadThemeAtlas === "function") {
				return window.__bloxLoadThemeAtlas(theme).catch(function () {
					return window.__bloxLoadThemeAtlas("original");
				});
			}
			return Promise.reject(new Error("atlas"));
		}

		function loadScript(src) {
			return new Promise(function (resolve, reject) {
				var el = document.createElement("script");
				el.src = src;
				el.onload = function () { resolve(); };
				el.onerror = function () { reject(new Error(src)); };
				document.head.appendChild(el);
			});
		}

		function init() {
			var imageSelect = document.getElementById("image_select");
			if (imageSelect) {
				imageSelect.value = getThemeFromUrl() || getStoredTheme();
			}

			canvas = document.getElementById("canvas");
			anim_container = document.getElementById("animation_container");
			dom_overlay_container = document.getElementById("dom_overlay_container");
			var versionEl = document.getElementById("build-version");
			if (versionEl) {
				versionEl.textContent = "v" + (window.GAME_VERSION || "2.5.0");
			}
			var wanted = getThemeFromUrl() || getStoredTheme() || "original";
			var atlasReady = loadThemeAtlas(wanted);
			Promise.all([
				atlasReady,
				loadScript("code.jquery.com/jquery-2.2.4.min.js").then(function () {
					return loadScript("components/sdk/anwidget.js");
				}).then(function () {
					return Promise.all([
						loadScript("components/ui/src/textinput.js"),
						loadScript("components/ui/src/css.js"),
					]);
				}),
			]).then(function (parts) {
				startWithAtlas(parts[0]);
				loadDeferredAssets();
			}).catch(function () {
				atlasReady.then(startWithAtlas).catch(function () {});
			});
		}

		function startWithAtlas(img) {
			var comp = AdobeAn.getComposition("FE31B685947E79408F0C8768D6EC8517");
			var images = comp.getImages();
			images["bloxorz_atlas_"] = img;
			handleComplete({
				target: {
					getResult: function (id) {
						return images[id];
					}
				}
			}, comp);
		}

		function loadDeferredAssets() {
			var comp = AdobeAn.getComposition("FE31B685947E79408F0C8768D6EC8517");
			var lib = comp.getLibrary();
			var later = (lib.properties.manifest || []).filter(function (item) {
				return /\.(mp3|wav|ogg)(\?|$)/i.test(item.src || "");
			});
			if (!later.length) return;
			// Non-blocking: start after first paint. Gesture-deferred decode caused first-play jank.
			var bg = new createjs.LoadQueue(false);
			bg.installPlugin(createjs.Sound);
			bg.addEventListener("error", function () {});
			bg.loadManifest(later);
		}

		function handleFileLoad(evt, comp) {
			var images = comp.getImages();
			if (evt && (evt.item.type == "image")) {
				images[evt.item.id] = evt.result;
			}
		}

		function handleComplete(evt, comp) {
			var lib = comp.getLibrary();
			var ss = comp.getSpriteSheet();
			var queue = evt.target;
			var ssMetadata = lib.ssMetadata;
			for (i = 0; i < ssMetadata.length; i++) {
				var sheetImg = queue.getResult(ssMetadata[i].name);
				if (!sheetImg) return;
				ss[ssMetadata[i].name] = new createjs.SpriteSheet({
					"images": [sheetImg],
					"frames": ssMetadata[i].frames
				});
			}

			var preloaderDiv = document.getElementById("_preload_div_");
			preloaderDiv.style.display = "none";
			dom_overlay_container.style.display = canvas.style.display = "block";
			exportRoot = new lib.bloxorzhtml();
			stage = new lib.Stage(canvas);
			var isTouchDevice = !!("ontouchstart" in window || navigator.maxTouchPoints);
			stage.enableMouseOver(0);
			window.__bloxSetMouseOver = function (hz) {
				stage.enableMouseOver(isTouchDevice ? 0 : hz);
			};
			fnStartAnimation = function () {
				stage.addChild(exportRoot);
				// RAF_SYNCHED + fps:36 locks to ~30fps on 60Hz displays (CreateJS skips every other RAF).
				// TIMEOUT honors the authored 36fps timeline without that half-rate snap.
				createjs.Ticker.timingMode = createjs.Ticker.TIMEOUT;
				createjs.Ticker.setFPS(lib.properties.fps || 36);
				createjs.Ticker.addEventListener("tick", stage);
			};
			function makeResponsive() {
				window.addEventListener("resize", resizeCanvas);
				resizeCanvas();

				function resizeCanvas() {
					var w = lib.properties.width, h = lib.properties.height;
					var iw = anim_container.offsetWidth;
					var ih = anim_container.offsetHeight;
					// Cap stage scale (~1375×750 backing) so fullscreen CSS can fill the screen
					// without a 4–18MP CreateJS buffer. DPR still applies up to 1.5 within the cap.
					var MAX_STAGE_SCALE = 2.5;
					var pRatio = Math.min(window.__bloxDenseBoard ? 1 : 1.5, window.devicePixelRatio || 1),
						xRatio = iw / w,
						yRatio = ih / h,
						displayScale = Math.min(xRatio, yRatio),
						stageScale = Math.min(pRatio * displayScale, MAX_STAGE_SCALE);

					var nextW = Math.round(w * stageScale);
					var nextH = Math.round(h * stageScale);
					var wpx = w * displayScale + "px";
					var hpx = h * displayScale + "px";
					if (
						canvas.width === nextW &&
						canvas.height === nextH &&
						canvas.style.width === wpx &&
						canvas.style.height === hpx
					) {
						return;
					}

					canvas.width = nextW;
					canvas.height = nextH;

					canvas.style.width = wpx;
					dom_overlay_container.style.width = wpx;
					canvas.style.height = hpx;
					dom_overlay_container.style.height = hpx;
					var hd = document.body.classList.contains("is-hd");
					canvas.style.imageRendering = hd ? "auto" : "pixelated";
					if (!hd) canvas.style.imageRendering = "crisp-edges";
					stage.scaleX = stageScale;
					stage.scaleY = stageScale;
					stage.tickOnUpdate = false;
					stage.update();
					stage.tickOnUpdate = true;
					var ctx = canvas.getContext("2d");
					if (ctx) {
						ctx.imageSmoothingEnabled = hd;
					}
				}
			}
			makeResponsive();
			AdobeAn.compositionLoaded(lib.properties.id);
			fnStartAnimation();
			if (typeof startBloxorzShell === "function") {
				startBloxorzShell();
			}
		}

		function playSound(id, loop) {
			return createjs.Sound.play(id, createjs.Sound.INTERRUPT_EARLY, 0, 0, loop || 0);
		}

		setTimeout(function () {
			if (document.getElementsByTagName("canvas").length) {
				document.getElementsByTagName("body")[0].classList.add("no-select");
			}
		}, 2000);

		function setUserAgent(window, userAgent) {
			if (navigator.__defineGetter__) {
				navigator.__defineGetter__("userAgent", function () {
					return userAgent;
				});
			} else if (Object.defineProperty) {
				Object.defineProperty(navigator, "userAgent", {
					get: function () {
						return userAgent;
					}
				});
			}
			if (window.navigator.userAgent !== userAgent) {
				var userAgentProp = {
					get: function () {
						return userAgent;
					}
				};
				try {
					Object.defineProperty(window.navigator, "userAgent", userAgentProp);
				} catch (e) {
					window.navigator = Object.create(navigator, {
						userAgent: userAgentProp
					});
				}
			}
		}
		if (window.navigator.userAgent.indexOf("Safari") >= 0 && "ontouchstart" in window && window.navigator.userAgent.indexOf("iPhone") == -1) {
			var userAgent = "Mozilla/5.0 (iPad; CPU OS 13_1_2 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/13.0.1 Mobile/15E148 Safari/604.1";
			setUserAgent(window, userAgent);
		}

		var canNotifyParent = window.parent && window.parent !== window;

		function fnSendMsg() {
			if (!canNotifyParent) return;
			window.parent.postMessage("keypress-from-game", "*");
		}

		document.body.addEventListener("click", fnSendMsg);
		document.addEventListener("keypress", fnSendMsg);
		document.addEventListener("keydown", fnSendMsg);
		document.addEventListener("keyup", fnSendMsg);

		function change_image() {
			var e = document.getElementById("image_select");
			var selectedTheme = normalizeTheme(e && e.value);
			saveTheme(selectedTheme);
			if (typeof window.applyLiveTheme === "function") {
				window.applyLiveTheme(selectedTheme);
				return;
			}
			window.location.href = buildThemeUrl(selectedTheme);
		}

		init();
	</script>
